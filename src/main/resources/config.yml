# ============================================================
#  LifestealPowers config
#  After editing, run  /powers reload  in game (or restart).
#  "level" 1 = the normal potion level, 2 = level II, etc.
#  Times are in SECONDS. Distances are in BLOCKS.
#  Set enabled: false to remove a power from the game
#  (nobody will be given it and it can't be used).
# ============================================================

hearts:
  max-hearts: 30          # most hearts anyone can reach from lifesteal
  min-hearts: 1           # nobody can drop below this many hearts
  hearts-per-kill: 1      # hearts stolen per player kill
  dragon-egg-bonus: 20    # extra hearts for whoever holds the dragon egg

powers:
  # ---------------- ACTIVE (right-click the Power Core) ----------------
  DASH:
    enabled: true
    cooldown: 8
    strength: 2.2         # how hard you launch forward
    lift: 0.4             # upward boost
  LEAP:
    enabled: true
    cooldown: 12
    height: 1.6           # upward speed
    slow-fall-seconds: 5
  FIREBALL:
    enabled: true
    cooldown: 6
    explosion-power: 1    # 1 = small, 4 = TNT-sized
  LIGHTNING:
    enabled: true
    cooldown: 20
    range: 40
  FREEZE:
    enabled: true
    cooldown: 25
    radius: 8
    duration: 5
    level: 5              # slowness level
  HEAL:
    enabled: true
    cooldown: 30
    duration: 10
    level: 3              # regeneration level
  TELEPORT:
    enabled: true
    cooldown: 10
    range: 30
  SHOCKWAVE:
    enabled: true
    cooldown: 15
    radius: 6
    strength: 2
  INVISIBILITY:
    enabled: true
    cooldown: 40
    duration: 10
  SPEED_BURST:
    enabled: true
    cooldown: 25
    duration: 10
    level: 3
  STRENGTH_SURGE:
    enabled: true
    cooldown: 35
    duration: 10
    level: 2
  SHIELD:
    enabled: true
    cooldown: 40
    duration: 8
    resistance-level: 4
    absorption-level: 3
  BLINDING_FLASH:
    enabled: true
    cooldown: 25
    radius: 10
    duration: 5
  WITHER_TOUCH:
    enabled: true
    cooldown: 30
    radius: 6
    duration: 5
    level: 2
  VOID_PULL:
    enabled: true
    cooldown: 20
    radius: 12
    strength: 1.4
  ARROW_STORM:
    enabled: true
    cooldown: 20
    arrows: 12
    speed: 2.5
  TNT_THROW:
    enabled: true
    cooldown: 15
    fuse-seconds: 2
    speed: 1.5
  SWAP:
    enabled: true
    cooldown: 30
    range: 25

  # ---------------- PASSIVE (always on) ----------------
  NIGHT_EYES:
    enabled: true
  WATER_LORD:
    enabled: true
  FIRE_WALKER:
    enabled: true
  HASTE_MINER:
    enabled: true
    level: 2
  FEATHER_FALL:
    enabled: true
  LUCKY_CHARM:
    enabled: true
    level: 2

# ---------------- WITHDRAWING ----------------
# /withdrawheart [amount]  -> turns your hearts into Heart items
# /withdrawpower <power>   -> turns one of your powers into a Power Crystal
withdraw:
  hearts: true
  powers: true

# ---------------- CRAFTING RECIPES ----------------
# shape = 3 rows of 3 letters (use a space for an empty slot)
# ingredients = what each letter means (any Minecraft item name)
# Run /powers reload after changing these.
recipes:
  # Heart: right-click to gain 1 heart
  heart:
    enabled: true
    shape:
      - "DTD"
      - "NSN"
      - "DTD"
    ingredients:
      D: DIAMOND_BLOCK
      T: TOTEM_OF_UNDYING
      N: NETHERITE_INGOT
      S: NETHER_STAR
  # Power Crystal: right-click to gain a random unclaimed power
  power-crystal:
    enabled: true
    shape:
      - "DSD"
      - "NAN"
      - "DSD"
    ingredients:
      D: DIAMOND_BLOCK
      S: NETHER_STAR
      N: NETHERITE_INGOT
      A: ENCHANTED_GOLDEN_APPLE
